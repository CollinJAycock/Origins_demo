# Keep the nginx version out of the Server header and error pages. This file is included in the http
# block, so the setting covers both servers below.
server_tokens off;

# Drop requests for any other host name (444 closes the connection without a reply), so a page that
# points its own domain at this machine (DNS rebinding) can't use the app as if it were its origin.
server {
    listen 8080 default_server;
    return 444;
}

server {
    listen 8080;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers on every response, errors included. The app loads only its own files and is never
    # framed. merge keeps these in the locations that add Cache-Control, which would otherwise drop them.
    add_header_inherit merge;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The SPA calls relative /api URLs; forward them to the API container.
    location /api/ {
        proxy_pass http://api:8080;
        # $http_host keeps the port, so URLs the API builds (e.g. Location headers) point back here.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Build assets have content hashes in their names, so they can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to the app shell, which is always revalidated.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
